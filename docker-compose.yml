services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incacore}
      POSTGRES_USER: ${POSTGRES_USER:-incacore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incacore}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/IncaCore
    env_file:
      - ./backend/IncaCore/.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-incacore}
      DB_USERNAME: ${POSTGRES_USER:-incacore}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-incacore}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-1234567890}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      FRONT_BASE_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
