name: Backend unit tests (deployed branch)

on:
  pull_request:
    branches: [feature/portfolio-demo]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-unit-tests.yml'
  push:
    branches: [feature/portfolio-demo]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-unit-tests.yml'

permissions:
  contents: read

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/IncaCore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run all JUnit tests
        run: ./mvnw -B -ntp test
