name: PostgreSQL transaction integration tests

on:
  pull_request:
    branches: [feature/portfolio-demo]
    paths:
      - 'backend/IncaCore/src/main/**'
      - 'backend/IncaCore/src/test/**'
      - 'backend/IncaCore/pom.xml'
      - '.github/workflows/postgres-integration-tests.yml'
  push:
    branches: [feature/portfolio-demo]
    paths:
      - 'backend/IncaCore/src/main/**'
      - 'backend/IncaCore/src/test/**'
      - 'backend/IncaCore/pom.xml'
      - '.github/workflows/postgres-integration-tests.yml'

permissions:
  contents: read

jobs:
  postgres-integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/IncaCore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test inventory transactions against PostgreSQL
        run: ./mvnw -B -ntp '-Dtest=*IT' test
